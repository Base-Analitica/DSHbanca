name: CI

on:
  push:
    branches: [ master, fix/* ]
  pull_request:
    branches: [ master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Typecheck
        run: bun run typecheck

      - name: Run Build
        run: bun run build

      - name: Run Tests
        run: bun test

      - name: Run Validation Script
        run: bash scripts/validate.sh

      - name: Run Secrets Check
        run: bash scripts/check-secrets.sh --ci
